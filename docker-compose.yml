services:
  postgres:
    image: postgres:16-alpine
    container_name: n8n-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=n8n
      - POSTGRES_PASSWORD=n8n_secure_password_2026
      - POSTGRES_DB=n8n_memory
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U n8n']
      interval: 5s
      timeout: 5s
      retries: 10

      
  n8n:
    image: n8nio/n8n:2.22.4
    container_name: n8n-main
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_RUNNERS_ENABLED=true
      - N8N_RUNNERS_MODE=external
      - N8N_RUNNERS_BROKER_LISTEN_ADDRESS=0.0.0.0
      - N8N_RUNNERS_AUTH_TOKEN=change-this-to-a-long-random-value
      - N8N_NATIVE_PYTHON_RUNNER=true
      - WEBHOOK_URL=https://n8n-turbomurzik.46.17.102.81.sslip.io
      - N8N_EDITOR_BASE_URL=https://n8n-turbomurzik.46.17.102.81.sslip.io
      - N8N_SECURE_COOKIE=false
    volumes:
      - n8n_data:/home/node/.n8n

  n8n-runners:
    image: n8nio/runners:2.22.4
    container_name: n8n-runners
    restart: unless-stopped
    environment:
      - N8N_RUNNERS_TASK_BROKER_URI=http://n8n-main:5679
      - N8N_RUNNERS_AUTH_TOKEN=change-this-to-a-long-random-value
    depends_on:
      - n8n

volumes:
  n8n_data:
  postgres_data: